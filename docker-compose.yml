# Sun & Water Resort — local development stack
# Currently only nginx for the frontend. Backend services (api, postgres,
# redis) will be added in a later milestone.

version: "3.9"

services:
  frontend:
    image: node:20-alpine
    container_name: swr-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true

