<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Set theme</title>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const theme = params.get("t") || "himalayan";
      try {
        localStorage.setItem("swr-theme", theme);
      } catch (e) {}
      // Use a meta refresh to navigate — more reliable than location.replace
      // from a static file context.
      document.write(
        '<meta http-equiv="refresh" content="0;url=/" />' +
          "<p>theme " + theme + " set. redirecting...</p>",
      );
    </script>
  </body>
</html>
